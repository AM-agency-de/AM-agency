<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الهوية البصرية | AM Agency</title>
    <style>
        /* تنسيقات الصفحة */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9; /* لون خلفية هادي */
            margin: 0;
            padding: 0;
        }
        .project-header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }
        .project-header h1 {
            margin: 0 0 10px 0;
            color: #f39c12; /* لون برتقالي متناسق مع موقعك */
        }
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #f39c12;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-button:hover {
            background-color: #e67e22;
        }
        .gallery {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .gallery img {
            width: 100%;
            height: auto;
            margin-bottom: 30px; /* مسافة بين كل صورة والتانية */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* ظل خفيف للصور */
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="project-header">
        <h1>مشروع تصميم هوية بصرية</h1>
        <p>عرض تفصيلي للشعار والأدوات المكتبية</p>
        <!-- زر الرجوع للصفحة الرئيسية -->
        <a href="index.html" class="back-button">الرجوع لمعرض الأعمال</a>
    </header>

    <!-- مساحة عرض الصور -->
    <section class="gallery">
        <!-- الصورة الأولى -->
        <img src="identity1.jpg" alt="صورة المشروع 1">
        
        <!-- الصورة الثانية -->
        <img src="identity2.jpg" alt="صورة المشروع 2">
        
        <!-- الصورة الثالثة -->
        <img src="identity4.jpg" alt="صورة المشروع 4">
        <img src="identity5.jpg" alt="صورة المشروع 5">
        <img src="identity6.jpg" alt="صورة المشروع 6">
        <img src="identity7.jpg" alt="صورة المشروع 7">

        <!-- لو عندك صور تانية، انسخ السطر اللي فوق وكرره هنا -->
    </section>

</body>
</html>
