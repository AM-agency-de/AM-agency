<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميم الأغلفة | AM Agency</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        .project-header { background-color: #333; color: #fff; text-align: center; padding: 40px 20px; }
        .project-header h1 { margin: 0 0 10px 0; color: #f39c12; }
        .back-button { display: inline-block; margin-top: 20px; padding: 10px 25px; background-color: #f39c12; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .back-button:hover { background-color: #e67e22; }
        .gallery { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .gallery img { width: 100%; height: auto; margin-bottom: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="project-header">
        <h1>تصميم الأغلفة (Covers)</h1>
        <p>تصميمات مبتكرة لأغلفة الكتب والمجلات</p>
        <a href="index.html" class="back-button">الرجوع لمعرض الأعمال</a>
    </header>

    <!-- مساحة عرض الصور -->
    <section class="gallery">
        <img src="images/protfolio/cover1.jpg" alt="غلاف 1">
        <img src="images/protfolio/cover2.jpg" alt="غلاف 2">
        <img src="images/protfolio/cover3.jpg" alt="غلاف 3">
        <!-- لو عندك صور أغلفة زيادة، انسخ السطر ده وزوده تحت وغير الرقم زي ما عملنا في اللوجوهات -->
    </section>

</body>
</html>
